# Local development stack: Go API + background worker + PostgreSQL + MongoDB.
# Values like ${POSTGRES_USER} are read from the .env file next to this file.

name: mscs

services:
  api:
    build:
      context: ./backend
    environment:
      APP_PORT: "8080"
      # Inside the compose network, services reach each other by service name (postgres, mongo).
      # The API logs in as mscs_app (restricted, subject to RLS), never as the superuser.
      DATABASE_URL: postgres://mscs_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB}
      ORDER_PAYMENT_WINDOW: ${ORDER_PAYMENT_WINDOW:-24h}
      # The Nuxt and SvelteKit dev servers run on the host and reach the API through Docker's
      # gateway (172.x.0.1), so that range may forward the real client IP. In production, list
      # only the frontend servers' addresses.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      # Encrypts the LINE credentials stored in PostgreSQL. Required; keep it secret and keep a copy:
      # without it, the saved credentials cannot be read anymore.
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      # Product photos: S3-compatible object storage (the "storage" service below).
      S3_ENDPOINT: storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: mscs-media
      # Absolute: the storefront and merchant pages (other ports) load photos from the API.
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:8080/api/v1/media/}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      storage:
        condition: service_healthy

  # Background jobs (expire unpaid storefront orders, delete expired sessions).
  # Same image as the API, different program. Safe to scale: `docker compose up -d --scale worker=2`
  # starts two, but only the elected leader (a Postgres advisory lock) runs the jobs.
  worker:
    build:
      context: ./backend
    entrypoint: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://mscs_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      WORKER_INTERVAL: ${WORKER_INTERVAL:-1m}
      ORDER_PAYMENT_WINDOW: ${ORDER_PAYMENT_WINDOW:-24h}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD} # read by initdb/01-create-app-role.sh
    ports:
      # Bound to localhost only, so the DB is not reachable from other machines on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<version>/...
      - pgdata:/var/lib/postgresql
      # Scripts here run once, on first start with an empty data volume.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for product photos (SeaweedFS "mini": every component in one
  # process, made for development). Not published to the host: only the API talks to it, and
  # browsers get the photos through the API. In production, point S3_ENDPOINT at AWS S3,
  # Cloudflare R2 or similar instead.
  storage:
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    # SeaweedFS reads S3 users from a JSON file: write it from the env, then start.
    # ($$ is a literal $ for the shell, not a compose variable.)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"mscs","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        && exec weed mini -dir=/data -s3.config=/tmp/s3.json -admin.ui=false
    volumes:
      - mediadata:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-off tool, not a long-running service: the "tools" profile keeps it out of `docker compose up`.
  # Usage: docker compose run --rm migrate up
  # Runs as the superuser/owner because it creates tables; the API never does.
  migrate:
    image: migrate/migrate:v4.19.0
    profiles: ["tools"]
    volumes:
      - ./backend/migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # Dev only: a public HTTPS URL for the API, so a real LINE Official Account can send webhooks
  # to this machine (LINE cannot reach localhost). Cloudflare "quick tunnel": no account needed,
  # the URL is random and changes on every start. It exposes the whole API, so stop it when done.
  # Usage: docker compose --profile tunnel up -d tunnel; docker compose logs tunnel  (find *.trycloudflare.com)
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8080"]
    depends_on:
      - api

# Named volumes: data survives `docker compose down` (removed only with `down -v`).
volumes:
  pgdata:
  mongodata:
  mediadata:
