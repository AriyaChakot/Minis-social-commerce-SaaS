# Local development stack: Go API + PostgreSQL + MongoDB.
# Values like ${POSTGRES_USER} are read from the .env file next to this file.

name: mscs

services:
  api:
    build:
      context: ./backend
    environment:
      APP_PORT: "8080"
      # Inside the compose network, services reach each other by service name (postgres, mongo).
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to localhost only, so the DB is not reachable from other machines on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<version>/...
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off tool, not a long-running service: the "tools" profile keeps it out of `docker compose up`.
  # Usage: docker compose run --rm migrate up
  migrate:
    image: migrate/migrate:v4.19.0
    profiles: ["tools"]
    volumes:
      - ./backend/migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

# Named volumes: data survives `docker compose down` (removed only with `down -v`).
volumes:
  pgdata:
  mongodata:
